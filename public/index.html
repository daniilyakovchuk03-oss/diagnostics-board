<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Доска диагностик — онлайн-отдел</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EDEB;
  --panel:#FFFFFF;
  --frame:#333B38;
  --frame-lit:#4C5652;
  --ink:#12171A;
  --muted:#6B7670;
  --rule:#CBD4D0;
  --rule-soft:#E2E8E5;

  --green:#0F7A45;
  --red:#C3271E;
  --blue:#1F4FD0;
  --amber:#B05806;
  --lime:#7B9E2E;

  --card-bg:#FFFFFF;
  --card-came:#F4FAF6;
  --card-no:#FCF5F4;
  --card-moved:#FDF8F2;
  --hover:#F3F6F4;
  --gtime-bg:#FAFBFA;
  --input-bg:#FFFFFF;
  --ring:rgba(31,79,208,.14);
  --no-opacity:.86;

  --r:10px;
  --shadow:0 1px 0 rgba(18,23,26,.04), 0 2px 8px rgba(18,23,26,.06);
  color-scheme:light;
}
html[data-theme="dark"]{
  --paper:#141A18;
  --panel:#1C2321;
  --frame:#0C100F;
  --frame-lit:#1B2320;
  --ink:#E7EEEA;
  --muted:#8C9A94;
  --rule:#2F3936;
  --rule-soft:#28312E;

  --green:#43C081;
  --red:#EF6A5E;
  --blue:#7099FF;
  --amber:#E3A055;
  --lime:#A3C94F;

  --card-bg:#212A27;
  --card-came:#172A22;
  --card-no:#2C1E1E;
  --card-moved:#2A2420;
  --hover:#26302D;
  --gtime-bg:#1A211F;
  --input-bg:#171D1B;
  --ring:rgba(112,153,255,.22);
  --no-opacity:.72;

  --shadow:0 1px 0 rgba(0,0,0,.2), 0 2px 10px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Golos Text",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}

/* ── Рамка доски ───────────────────────────── */
.frame{
  background:linear-gradient(180deg,var(--frame-lit),var(--frame));
  color:#fff;
  padding:14px 20px;
  display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:30;
  box-shadow:0 2px 10px rgba(0,0,0,.18);
}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand h1{
  font-family:"Oswald",sans-serif;font-weight:500;
  font-size:22px;letter-spacing:.14em;text-transform:uppercase;margin:0;white-space:nowrap;
}
.brand .dept{font-size:12px;color:#B9C4BF;letter-spacing:.06em;text-transform:uppercase}

.nav{display:flex;align-items:center;gap:6px}
.nav button{
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);
  color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;
  font-size:14px;transition:background .15s ease;
}
.nav button:hover{background:rgba(255,255,255,.18)}
.nav .date{
  font-family:"IBM Plex Mono",monospace;font-size:14px;
  padding:6px 10px;min-width:180px;text-align:center;color:#EAF0ED;
  border:1px solid rgba(255,255,255,.16);border-radius:8px;background:rgba(0,0,0,.14);
}
.src{
  font-size:12px;color:#B9C4BF;display:flex;align-items:center;gap:7px;
}
.src .dot{width:7px;height:7px;border-radius:50%;background:#E0A93B;box-shadow:0 0 0 3px rgba(224,169,59,.2)}
.theme{
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);
  color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;
  display:grid;place-items:center;margin-left:4px;transition:background .15s ease;
}
.theme:hover{background:rgba(255,255,255,.18)}

/* ── Полоса показателей ────────────────────── */
.stats{
  display:flex;gap:0;flex-wrap:wrap;
  background:var(--panel);border-bottom:1px solid var(--rule);
  padding:0 20px;
}
.stat{padding:12px 22px 12px 0;margin-right:22px;border-right:1px solid var(--rule-soft);display:flex;align-items:baseline;gap:8px}
.stat:last-child{border-right:0}
.stat b{font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat.g b{color:var(--green)} .stat.r b{color:var(--red)} .stat.b b{color:var(--blue)}

/* ── Каркас страницы ───────────────────────── */
.wrap{display:grid;grid-template-columns:236px 1fr;gap:20px;padding:20px;align-items:start}

/* ── Рельса МК ─────────────────────────────── */
.rail{position:sticky;top:78px}
.rail h2,.board h2{
  font-family:"Oswald",sans-serif;font-weight:500;font-size:13px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 10px 2px;
}
.mk{
  background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);
  padding:11px 12px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left;
  display:block;transition:border-color .15s ease, transform .1s ease;
}
.mk:hover{border-color:var(--frame-lit)}
.mk[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 2px var(--ring)}
.mk__top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mk__time{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.mk__n{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted)}
.mk__bar{height:5px;background:var(--rule-soft);border-radius:3px;margin:9px 0 6px;overflow:hidden}
.mk__fill{height:100%;border-radius:3px;transition:width .3s ease}
.mk__label{font-size:12px;color:var(--muted)}
.legend{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* ── Панель управления доской ──────────────── */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.chip{
  background:var(--panel);border:1px solid var(--rule);border-radius:99px;
  padding:6px 14px;font-size:13px;cursor:pointer;transition:.15s ease;
}
.chip:hover{border-color:var(--frame-lit)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.spacer{flex:1}
.add{
  background:var(--blue);color:#fff;border:0;border-radius:8px;padding:8px 16px;
  cursor:pointer;font-weight:500;box-shadow:var(--shadow);
}
.add:hover{filter:brightness(1.08)}
html[data-theme="dark"] .add{color:#0E1412}

/* ── Колонки менеджеров ────────────────────── */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.col{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.col__head{padding:12px 14px 11px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.col__name{font-family:"Oswald",sans-serif;font-weight:500;font-size:21px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.col__count{padding:6px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--rule-soft);display:flex;gap:10px}
.col__count b{font-weight:600;color:var(--ink)}
.col__list{padding:8px;display:flex;flex-direction:column;gap:6px;min-height:70px}

.card{
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;
  padding:9px 9px 9px 11px;border-radius:8px;border:1px solid var(--rule-soft);
  background:var(--card-bg);border-left:3px solid var(--blue);
}
.card:hover{border-color:var(--rule);border-left-color:inherit}
.card[data-status="came"]{border-left-color:var(--green);background:var(--card-came)}
.card[data-status="no"]{border-left-color:var(--red);background:var(--card-no);opacity:var(--no-opacity)}
.card[data-status="moved"]{border-left-color:var(--amber);background:var(--card-moved)}
.card__time{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;padding-top:1px}
.card[data-status="no"] .card__name{text-decoration:line-through;text-decoration-color:var(--red)}
.card__name{font-weight:500;font-size:15px;overflow-wrap:anywhere}
.card__meta{font-size:11.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace;margin-top:2px}
.card__note{font-size:12px;color:var(--amber);margin-top:3px}
.mark{
  width:30px;height:30px;border-radius:7px;border:1px dashed var(--rule);
  background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;
  transition:.15s ease;
}
.mark:hover{border-color:var(--frame-lit);background:var(--hover)}
.card[data-status="came"] .mark,.card[data-status="no"] .mark,.card[data-status="moved"] .mark{border-style:solid;border-color:transparent}
.mark svg{display:block}
.empty{padding:16px 12px;font-size:13px;color:var(--muted);text-align:center}

/* ── Сетка по времени ──────────────────────── */
.grid{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);overflow:auto;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{border-bottom:1px solid var(--rule-soft);border-right:1px solid var(--rule-soft);vertical-align:top;padding:5px}
th{position:sticky;top:0;background:var(--panel);z-index:2;padding:11px 10px;text-align:left;border-bottom:2px solid var(--ink)}
th.t{width:64px}
.gtime{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted);padding:9px 8px;font-variant-numeric:tabular-nums;white-space:nowrap;background:var(--gtime-bg)}
.gtime.hour{color:var(--ink);font-weight:600}
tr:hover .gtime{color:var(--ink)}
.grid .card{border-left-width:3px}
.hidden{display:none !important}

/* ── Диалог ────────────────────────────────── */
dialog{border:1px solid var(--rule);border-radius:12px;padding:0;background:var(--panel);color:var(--ink);max-width:400px;width:calc(100% - 32px);box-shadow:0 18px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(18,23,26,.42)}
.dlg__head{padding:16px 18px 0}
.dlg__head h3{font-family:"Oswald",sans-serif;font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-size:16px;margin:0}
form.dlg{padding:14px 18px 18px;display:grid;gap:11px}
label{font-size:12px;color:var(--muted);display:grid;gap:4px}
input,select,textarea{
  font:inherit;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;color:var(--ink);background:var(--input-bg);
}
textarea{resize:vertical;min-height:52px}
.dlg__row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.dlg__foot{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.btn-ghost{background:transparent;border:1px solid var(--rule);border-radius:8px;padding:8px 14px;cursor:pointer}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr;gap:16px;padding:14px}
  .rail{position:static}
  .rail .mks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .mk{margin-bottom:0}
  .stat{padding-right:16px;margin-right:16px}
  .brand h1{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style><style>
.mark{cursor:default}
.mark:hover{border-color:var(--rule);background:transparent}
.wrap.solo{grid-template-columns:1fr}
.notice{max-width:820px;margin:0 auto;padding:26px 22px;background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);text-align:center;color:var(--muted)}
.notice b{color:var(--ink);display:block;margin-bottom:6px;font-size:16px}
.notice a{color:var(--blue)}
</style>
</head>
<body>

<header class="frame">
  <div class="brand">
    <h1>Диагностики</h1>
    <span class="dept">Онлайн-отдел</span>
  </div>
  <div class="nav">
    <button id="prev" aria-label="Предыдущий день">←</button>
    <div class="date" id="dateLabel">—</div>
    <button id="next" aria-label="Следующий день">→</button>
    <button id="today">Сегодня</button>
  </div>
  <div class="src">
    <span class="dot" id="dot"></span> <span id="srcText">подключение…</span>
    <button id="theme" class="theme" title="Сменить тему" aria-label="Сменить тему"></button>
  </div>
</header>

<div class="stats" id="stats"></div>

<div class="wrap" id="wrap">
  <aside class="rail" id="rail" hidden>
    <h2>Мастер-классы</h2>
    <div class="mks" id="mks"></div>
  </aside>

  <main class="board">
    <div class="controls">
      <button class="chip" data-filter="all" aria-pressed="true">Все</button>
      <button class="chip" data-filter="wait" aria-pressed="false">Ожидают</button>
      <button class="chip" data-filter="came" aria-pressed="false">Пришли</button>
      <button class="chip" data-filter="no" aria-pressed="false">Не пришли</button>
      <span class="spacer"></span>
      <button class="chip" id="viewBoard" aria-pressed="true">Доска</button>
      <button class="chip" id="viewGrid" aria-pressed="false">Сетка по времени</button>
    </div>

    <div id="notice" class="notice" hidden></div>
    <div class="cols" id="cols"></div>
    <div class="grid hidden" id="gridWrap"></div>
  </main>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   Доска только показывает. Источник правды — этапы в amoCRM.
   Данные приходят с нашего сервера, он забирает их у амо.
   ═══════════════════════════════════════════════════════════ */

let MANAGERS = [];
const STATUS_NAME = {wait:'Ожидает', came:'Пришёл', no:'Не пришёл', moved:'Перенос'};
const today = new Date();
const state = { date:new Date(today), items:[], filter:'all', mk:null, view:'board', mkEnabled:false, configured:false, updatedAt:null, failed:false };

const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const isToday = d => iso(d)===iso(today);

function markSVG(st){
  if(st==='came')  return `<svg width="19" height="19" viewBox="0 0 19 19"><path d="M3 10.5 L7.4 15 L16 4.5" fill="none" stroke="var(--green)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  if(st==='no')    return `<svg width="19" height="19" viewBox="0 0 19 19"><path d="M4 4 L15 15 M15 4 L4 15" fill="none" stroke="var(--red)" stroke-width="2.6" stroke-linecap="round"/></svg>`;
  if(st==='moved') return `<svg width="19" height="19" viewBox="0 0 19 19"><path d="M3.5 12.5 h9.5 a3 3 0 0 0 0-6 H7" fill="none" stroke="var(--amber)" stroke-width="2.4" stroke-linecap="round"/><path d="M9.5 3.5 L6.5 6.5 L9.5 9.5" fill="none" stroke="var(--amber)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  return `<svg width="19" height="19" viewBox="0 0 19 19"><circle cx="9.5" cy="9.5" r="4.2" fill="none" stroke="#AEB9B4" stroke-width="2"/></svg>`;
}

/* ── Загрузка ─────────────────────────────────────────────── */
async function loadConfig(){
  try{
    const r = await fetch('/api/config'); const c = await r.json();
    MANAGERS = c.managers; state.mkEnabled = c.mkEnabled; state.configured = c.configured;
  }catch(e){ state.failed = true; }
}
async function loadDay(){
  try{
    const r = await fetch('/api/appointments?date='+iso(state.date));
    const d = await r.json();
    state.items = d.items || []; state.updatedAt = d.updatedAt; state.failed = false;
  }catch(e){ state.failed = true; }
  render();
}

/* ── Отрисовка ────────────────────────────────────────────── */
function visible(){
  return state.items.filter(x=>{
    if(state.mk && x.mk !== state.mk) return false;
    if(state.filter==='all') return true;
    return x.st === state.filter;
  });
}

function cardHTML(x){
  const meta = [x.mk ? 'МК '+x.mk : null].filter(Boolean).join(' · ');
  return `<article class="card" data-status="${x.st}">
    <div class="card__time">${x.t}</div>
    <div>
      <div class="card__name">${x.c}</div>
      ${meta ? `<div class="card__meta">${meta}</div>` : ''}
      ${x.note ? `<div class="card__note">${x.note}</div>` : ''}
    </div>
    <span class="mark" title="${STATUS_NAME[x.st]}" aria-label="${STATUS_NAME[x.st]}">${markSVG(x.st)}</span>
  </article>`;
}

function renderCols(){
  const vis = visible();
  document.getElementById('cols').innerHTML = MANAGERS.map(m=>{
    const mine = vis.filter(x=>x.m===m.id).sort((a,b)=>a.t.localeCompare(b.t));
    const total = state.items.filter(x=>x.m===m.id);
    const came = total.filter(x=>x.st==='came').length;
    return `<section class="col">
      <div class="col__head"><span class="col__name">${m.name}</span></div>
      <div class="col__count"><span>Встреч <b>${total.length}</b></span><span>Дошли <b>${came}</b></span></div>
      <div class="col__list">${mine.length ? mine.map(cardHTML).join('') : '<div class="empty">Записей нет</div>'}</div>
    </section>`;
  }).join('');
}

function renderGrid(){
  const vis = visible();
  let rows = '';
  for(let mnt=9*60; mnt<=20*60; mnt+=30){
    const t = pad(Math.floor(mnt/60))+':'+pad(mnt%60);
    rows += `<tr><td class="gtime ${mnt%60===0?'hour':''}">${t}</td>` +
      MANAGERS.map(m=>`<td>${vis.filter(x=>x.m===m.id && x.t===t).map(cardHTML).join('')}</td>`).join('') + '</tr>';
  }
  document.getElementById('gridWrap').innerHTML =
    `<table><thead><tr><th class="t">Время</th>${MANAGERS.map(m=>`<th><span class="col__name">${m.name}</span></th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;
}

function renderStats(){
  const a = state.items;
  const came = a.filter(x=>x.st==='came').length;
  const no   = a.filter(x=>x.st==='no').length;
  const wait = a.filter(x=>x.st==='wait').length;
  const done = came + no;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${a.length}</b><span>Назначено</span></div>
    <div class="stat g"><b>${came}</b><span>Дошли</span></div>
    <div class="stat r"><b>${no}</b><span>Не дошли</span></div>
    <div class="stat b"><b>${wait}</b><span>Ожидают</span></div>
    <div class="stat"><b>${done ? Math.round(came/done*100) : 0}%</b><span>Доходимость</span></div>`;
}

function renderSource(){
  const dot = document.getElementById('dot'), txt = document.getElementById('srcText');
  if(state.failed){ dot.style.background='#EF6A5E'; txt.textContent='Нет связи с сервером'; return; }
  if(!state.configured){ dot.style.background='#E0A93B'; txt.textContent='Не настроено — откройте /setup'; return; }
  dot.style.background='#43C081';
  const u = state.updatedAt ? new Date(state.updatedAt) : null;
  txt.textContent = 'amoCRM · обновлено ' + (u ? pad(u.getHours())+':'+pad(u.getMinutes()) : '—');
}

function renderNotice(){
  const n = document.getElementById('notice');
  if(!state.configured){
    n.hidden = false;
    n.innerHTML = '<b>Доска ещё не настроена</b>Откройте страницу <a href="/setup">/setup</a>, пришлите скриншот — и заполним соответствия полей и этапов.';
  } else n.hidden = true;
}

function render(){
  const f = new Intl.DateTimeFormat('ru-RU',{weekday:'short', day:'numeric', month:'long'});
  document.getElementById('dateLabel').textContent = f.format(state.date) + (isToday(state.date) ? ' · сегодня' : '');
  document.getElementById('rail').hidden = !state.mkEnabled;
  document.getElementById('wrap').classList.toggle('solo', !state.mkEnabled);
  renderStats(); renderSource(); renderNotice();
  state.view==='board' ? renderCols() : renderGrid();
  document.getElementById('cols').classList.toggle('hidden', state.view!=='board');
  document.getElementById('gridWrap').classList.toggle('hidden', state.view!=='grid');
}

/* ── События ──────────────────────────────────────────────── */
document.addEventListener('click', e=>{
  const chip = e.target.closest('.chip[data-filter]');
  if(chip){
    state.filter = chip.dataset.filter;
    document.querySelectorAll('.chip[data-filter]').forEach(c=>c.setAttribute('aria-pressed', c===chip));
    render();
  }
});
function setView(v){
  state.view = v;
  document.getElementById('viewBoard').setAttribute('aria-pressed', v==='board');
  document.getElementById('viewGrid').setAttribute('aria-pressed', v==='grid');
  render();
}
document.getElementById('viewBoard').onclick = ()=>setView('board');
document.getElementById('viewGrid').onclick  = ()=>setView('grid');
document.getElementById('prev').onclick  = ()=>{ state.date.setDate(state.date.getDate()-1); loadDay(); };
document.getElementById('next').onclick  = ()=>{ state.date.setDate(state.date.getDate()+1); loadDay(); };
document.getElementById('today').onclick = ()=>{ state.date = new Date(today); loadDay(); };

/* ── Тема ─────────────────────────────────────────────────── */
const themeBtn = document.getElementById('theme');
const SUN  = `<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.6v2M10 16.4v2M18.4 10h-2M3.6 10h-2M15.9 4.1l-1.4 1.4M5.5 14.5l-1.4 1.4M15.9 15.9l-1.4-1.4M5.5 5.5L4.1 4.1"/></svg>`;
const MOON = `<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M16.5 12.4A7 7 0 0 1 7.6 3.5a7 7 0 1 0 8.9 8.9Z"/></svg>`;
function setTheme(t){ document.documentElement.dataset.theme = t; themeBtn.innerHTML = t==='dark' ? SUN : MOON; }
setTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
themeBtn.onclick = ()=> setTheme(document.documentElement.dataset.theme==='dark' ? 'light' : 'dark');

/* ── Старт и автообновление ───────────────────────────────── */
(async ()=>{ await loadConfig(); await loadDay(); })();
setInterval(loadDay, 20000);
</script>
</body>
</html>
